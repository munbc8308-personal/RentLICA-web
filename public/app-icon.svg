<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#gradient)"/>

  <!-- House Icon -->
  <g transform="translate(96, 96)">
    <!-- Roof -->
    <path d="M160 80L280 180H40L160 80Z" fill="white"/>
    <path d="M40 180L160 80L280 180" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- House Body -->
    <rect x="60" y="180" width="200" height="160" rx="8" fill="white"/>

    <!-- Door -->
    <rect x="130" y="230" width="60" height="110" rx="4" fill="#3B82F6"/>
    <circle cx="175" cy="290" r="6" fill="white"/>

    <!-- Windows -->
    <rect x="80" y="210" width="40" height="40" rx="4" fill="#3B82F6" opacity="0.8"/>
    <rect x="200" y="210" width="40" height="40" rx="4" fill="#3B82F6" opacity="0.8"/>

    <!-- Window Dividers -->
    <line x1="100" y1="210" x2="100" y2="250" stroke="white" stroke-width="3"/>
    <line x1="80" y1="230" x2="120" y2="230" stroke="white" stroke-width="3"/>
    <line x1="220" y1="210" x2="220" y2="250" stroke="white" stroke-width="3"/>
    <line x1="200" y1="230" x2="240" y2="230" stroke="white" stroke-width="3"/>
  </g>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
</svg>
